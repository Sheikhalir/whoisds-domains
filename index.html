<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newly Registered Domains – Niche Finder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --page: #f4f4f2; --surface-1: #fcfcfb; --surface-2: #f0efec;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
    --grid: #e1e0d9; --border: #e1e0d9;
    --series-1: #2a78d6; --series-1-soft: rgba(42,120,214,.12);
    --mark: rgba(237,161,0,.28); --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #111110; --surface-1: #1a1a19; --surface-2: #242422;
      --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #898781;
      --grid: #2c2c2a; --border: #2c2c2a;
      --series-1: #3987e5; --series-1-soft: rgba(57,135,229,.18);
      --mark: rgba(201,133,0,.38); --critical: #e66767;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text-primary); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 22px 20px 48px; }
  .num { font-variant-numeric: tabular-nums; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  h1 { font-size: 22px; margin: 0 0 2px; letter-spacing: -.01em; }
  h2 { font-size: 14px; margin: 0; font-weight: 600; }
  .sub { color: var(--text-secondary); font-size: 13px; }
  .muted { color: var(--text-muted); }
  a { color: var(--series-1); }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .tabs button { border: 0; background: none; font: inherit; font-size: 14px; padding: 9px 14px; color: var(--text-secondary); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button[aria-selected="true"] { color: var(--text-primary); font-weight: 600; border-bottom-color: var(--series-1); }

  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 16px; min-width: 0; }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }
  .tile .label { color: var(--text-secondary); font-size: 12px; }
  .tile .value { font-size: 24px; font-weight: 600; letter-spacing: -.02em; margin-top: 2px; }
  .tile .note { color: var(--text-muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--text-secondary); padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--text-primary); font-weight: 600; }
  .btn { border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); border-radius: 7px; padding: 6px 11px; font: inherit; font-size: 13px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .btn:hover:not(:disabled) { background: var(--surface-2); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--series-1); border-color: var(--series-1); color: #fff; }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--series-1); }
  .btn.small { padding: 3px 8px; font-size: 12px; }
  select, input[type="search"], input[type="text"], input[type="password"] { border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); border-radius: 7px; padding: 6px 9px; font: inherit; font-size: 13px; }
  input[type="search"], input[type="text"], input[type="password"] { width: 100%; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .filters label { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }

  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .chart .bar { cursor: pointer; }
  .tip { position: fixed; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border); border-radius: 7px; padding: 7px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); display: none; z-index: 10; }
  .tip b { display: block; font-size: 13px; }

  .scroll { overflow: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 600; font-size: 12px; color: var(--text-secondary); padding: 6px 8px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1; background: var(--surface-1); }
  td { padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  td.r, th.r { text-align: right; }
  .domain { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 13px; word-break: break-all; }
  .idx { color: var(--text-muted); width: 56px; }
  .chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--surface-2); color: var(--text-secondary); margin: 1px 3px 1px 0; white-space: nowrap; }
  .chip.custom { background: var(--mark); color: var(--text-primary); }

  /* niche list */
  .nf-grid { display: grid; grid-template-columns: 360px 1fr; gap: 12px; align-items: start; }
  .group-h { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin: 12px 6px 4px; display: flex; justify-content: space-between; }
  .group-h:first-child { margin-top: 0; }
  .nrow { display: grid; grid-template-columns: 16px 1fr 54px 48px; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 6px; cursor: pointer; font-size: 13px; user-select: none; }
  .nrow:hover { background: var(--surface-2); }
  .nrow.on { background: var(--series-1-soft); font-weight: 600; }
  .nrow.zero { color: var(--text-muted); }
  .box { width: 14px; height: 14px; border: 1.5px solid var(--text-muted); border-radius: 3px; display: grid; place-items: center; font-size: 10px; line-height: 1; color: #fff; }
  .nrow.on .box { background: var(--series-1); border-color: var(--series-1); }
  .nrow .track { height: 8px; }
  .nrow .fill { height: 8px; background: var(--series-1); border-radius: 0 4px 4px 0; min-width: 2px; }
  .nrow .cnt { text-align: right; color: var(--text-secondary); }
  .nrow .x { color: var(--text-muted); font-size: 12px; margin-left: 4px; }
  .nrow .x:hover { color: var(--critical); }
  .custom-box { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  .hint { font-size: 12px; color: var(--text-muted); margin-top: 6px; }

  /* daily tab */
  .row2 { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; margin-bottom: 12px; }
  .row-viewer { display: grid; grid-template-columns: 280px 1fr; gap: 16px; }
  #files tr { cursor: pointer; }
  #files tr:hover td { background: var(--surface-2); }
  #files tr.active td { background: var(--series-1-soft); }
  #files td a { text-decoration: none; font-size: 12px; }
  .tld { display: grid; grid-template-columns: 70px 1fr 64px; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .tld:hover { background: var(--surface-2); }
  .tld.active { background: var(--series-1-soft); font-weight: 600; }
  .tld .track { height: 10px; }
  .tld .fill { height: 10px; background: var(--series-1); border-radius: 0 4px 4px 0; min-width: 2px; }
  .tld .cnt { text-align: right; color: var(--text-secondary); }
  .viewer-title { font-size: 18px; font-weight: 600; }

  .pager { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .msg { padding: 28px; text-align: center; color: var(--text-secondary); }
  .msg.err { color: var(--critical); }
  .progress { height: 3px; background: var(--surface-2); border-radius: 2px; overflow: hidden; margin-top: 8px; }
  .progress div { height: 100%; background: var(--series-1); width: 0; transition: width .2s; }


  /* header, pills, toast, dialogs */
  .hdr-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .pill { border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary); border-radius: 20px; padding: 5px 12px; font: inherit; font-size: 12px; cursor: pointer; max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill:hover { background: var(--surface-2); }
  .pill.ok { color: var(--text-primary); border-color: var(--series-1); }
  .pill.busy { color: var(--text-secondary); }
  .pill.err { color: var(--critical); border-color: var(--critical); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text-primary); color: var(--surface-1); padding: 9px 12px 9px 16px; border-radius: 9px; display: flex; gap: 12px; align-items: center; font-size: 13px; box-shadow: 0 6px 24px rgba(0,0,0,.2); z-index: 20; max-width: 90vw; }
  .toast[hidden] { display: none; }
  .toast .btn { background: transparent; color: inherit; border-color: currentColor; }
  dialog { border: 1px solid var(--border); border-radius: 12px; padding: 0; background: var(--surface-1); color: var(--text-primary); width: min(560px, 94vw); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  .dlg { padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; }
  .dlg h2 { font-size: 17px; }
  .dlg p { margin: 0; }
  .dlg textarea { width: 100%; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-1); color: var(--text-primary); padding: 10px; font: 13px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; resize: vertical; }
  .dlg-actions { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-secondary); }
  .steps { margin: 0; padding-left: 20px; font-size: 13px; color: var(--text-secondary); display: grid; gap: 4px; }
  .fmt { font-size: 12px; color: var(--text-secondary); display: grid; gap: 3px; background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: var(--surface-2); padding: 0 4px; border-radius: 4px; color: var(--text-primary); }
  .fmt code { background: var(--surface-1); }
  .notice { font-size: 12px; border-radius: 8px; padding: 8px 10px; background: var(--mark); color: var(--text-primary); }
  .notice.ok { background: var(--series-1-soft); }
  .hint.err { color: var(--critical); }
  .warn { border: 1px solid var(--critical); background: var(--surface-1); color: var(--text-primary); border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 12px; }
  .warn b { color: var(--critical); }
  .active-filters { display: flex; align-items: center; gap: 10px; margin: -4px 0 12px; flex-wrap: wrap; }
  .linkbtn { background: none; border: 0; padding: 0; font: inherit; font-size: 12px; color: var(--series-1); cursor: pointer; text-transform: none; letter-spacing: 0; }
  .linkbtn:hover { text-decoration: underline; }
  .seed-empty { border: 1px dashed var(--border); border-radius: 8px; padding: 10px; margin: 2px 0 6px; cursor: pointer; font-size: 13px; }
  .seed-empty:hover { background: var(--surface-2); }
  .new { font-size: 10px; background: var(--mark); border-radius: 8px; padding: 0 5px; margin-left: 6px; font-weight: 600; }
  .chip.seed { background: var(--mark); color: var(--text-primary); }
  /* view tabs, row actions, grouped view */
  .vtabs { display: flex; gap: 2px; margin: -6px 0 12px; border-bottom: 1px solid var(--border); }
  .vtabs button { border: 0; background: none; font: inherit; font-size: 13px; padding: 6px 10px; color: var(--text-secondary); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .vtabs button[aria-selected="true"] { color: var(--text-primary); font-weight: 600; border-bottom-color: var(--series-1); }
  td.act, th.act { width: 58px; white-space: nowrap; padding-right: 0; }
  .icon { border: 0; background: none; cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 4px; border-radius: 5px; color: var(--text-muted); }
  .icon:hover { background: var(--surface-2); color: var(--text-primary); }
  .icon.star.on { color: #eda100; }
  .icon.dis { font-size: 12px; }
  .icon.dis:hover { color: var(--critical); }
  .group { border: 1px solid var(--border); border-radius: 9px; margin-bottom: 12px; overflow: hidden; }
  .group-title { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; background: var(--surface-2); flex-wrap: wrap; }
  .group table th { background: var(--surface-1); }

  @media (max-width: 960px) {
    .tiles { grid-template-columns: repeat(2, 1fr); }
    .row2, .row-viewer, .nf-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Newly Registered Domains</h1>
      <div class="sub">Daily lists from whoisds.com, sorted into service niches automatically</div>
    </div>
    <div class="hdr-right">
      <span class="sub" id="updated"></span>
      <button class="pill" id="sync" title="Save seed keywords and favorites to your GitHub repository">Connect GitHub</button>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="niche" aria-selected="true">Niche Finder</button>
    <button role="tab" data-tab="daily" aria-selected="false">Daily Files</button>
  </nav>
  <div id="tab-niche"><div class="card msg">Loading…</div></div>
  <div id="tab-daily" hidden></div>
</div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast" role="status" hidden></div>
<dialog id="dlg-gh"></dialog>
<dialog id="dlg-seeds"></dialog>

<script>
(() => {
  // ---------- helpers ----------
  const PAGE_SIZE = 100;
  const $ = (s, root = document) => root.querySelector(s);
  const fmt = n => n.toLocaleString("en-US");
  const kb = b => b >= 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.round(b / 1024) + " KB";
  const prettyDate = d => new Date(d + "T00:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids) if (k != null) n.append(k);
    return n;
  };
  const _rc = Element.prototype.replaceChildren;
  Element.prototype.replaceChildren = function (...k) { return _rc.apply(this, k.filter(x => x != null)); };
  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  const labelOf = d => d.toLowerCase().split(".")[0].replace(/-/g, "");
  const tldOf = d => d.slice(d.lastIndexOf(".") + 1).toLowerCase();
  const store = {
    get(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  async function getJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error(url + ": HTTP " + r.status); return r.json(); }
  async function eachLimit(items, limit, fn) {
    let i = 0; const run = async () => { while (i < items.length) { const k = i++; await fn(items[k], k); } };
    await Promise.all(Array.from({ length: Math.min(limit, items.length) }, run));
  }
  function download(name, text, type = "text/plain") {
    const a = el("a", { href: URL.createObjectURL(new Blob([text], { type })), download: name });
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  function highlight(domain, kws) {
    const low = domain.toLowerCase(), spans = [];
    for (const k of new Set(kws)) { const i = low.indexOf(k); if (i >= 0) spans.push([i, i + k.length]); }
    spans.sort((a, b) => a[0] - b[0]);
    const merged = [];
    for (const sp of spans) { const last = merged[merged.length - 1]; if (last && sp[0] <= last[1]) last[1] = Math.max(last[1], sp[1]); else merged.push(sp.slice()); }
    const span = el("span", { class: "domain" });
    let pos = 0;
    for (const [a, b] of merged) { span.append(domain.slice(pos, a), el("mark", {}, domain.slice(a, b))); pos = b; }
    span.append(domain.slice(pos));
    return span;
  }

  // ---------- shared data ----------
  let days = [], cfg = { niches: [], locations: [] }, meta = new Map(), locList = [];
  const domainCache = new Map();          // date -> string[]
  async function loadDomains(date) {
    if (domainCache.has(date)) return domainCache.get(date);
    const r = await fetch("data/zip/" + date + ".zip");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const zip = await JSZip.loadAsync(await r.arrayBuffer());
    const files = Object.values(zip.files).filter(f => !f.dir);
    const text = (await Promise.all(files.map(f => f.async("string")))).join("\n");
    const list = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    domainCache.set(date, list);
    return list;
  }
  const locate = label => { for (const [k, v] of locList) if (label.includes(k)) return v; return ""; };

  // ---------- bar chart (single series) ----------
  function drawBars(box, data, { selected, onClick, unit = "domains" } = {}) {
    const W = box.clientWidth, H = box.clientHeight; if (!W) return;
    const m = { t: 10, r: 4, b: 22, l: 44 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
    const max = Math.max(...data.map(d => d.value), 1), stepV = niceStep(max / 4), ticks = Math.max(1, Math.ceil(max / stepV)), nice = stepV * ticks;
    const slot = iw / Math.max(1, data.length), bw = Math.max(2, Math.min(28, slot - 2));
    const y = v => m.t + ih - (v / nice) * ih;
    const ns = "http://www.w3.org/2000/svg";
    const s = (tag, a) => { const n = document.createElementNS(ns, tag); for (const k in a) n.setAttribute(k, a[k]); return n; };
    const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Bar chart of " + unit + " per day" });
    for (let i = 0; i <= ticks; i++) {
      const v = nice / ticks * i, yy = y(v);
      svg.append(s("line", { x1: m.l, x2: W - m.r, y1: yy, y2: yy, stroke: "var(--grid)", "stroke-width": 1 }));
      const t = s("text", { x: m.l - 8, y: yy + 4, "text-anchor": "end", fill: "var(--text-muted)", "font-size": 11 });
      t.textContent = v >= 1000 ? (+(v / 1000).toFixed(1)) + "k" : +v.toFixed(1); svg.append(t);
    }
    const every = Math.ceil(data.length / Math.max(1, Math.floor(iw / 56)));
    const tip = $("#tip");
    data.forEach((d, i) => {
      const cx = m.l + slot * i + slot / 2, x = cx - bw / 2, top = y(d.value), h = m.t + ih - top, r = Math.min(4, bw / 2, h);
      const g = s("g", { class: "bar" });
      g.append(s("rect", { x: m.l + slot * i, y: m.t, width: slot, height: ih, fill: "transparent" }));
      if (h > 0) g.append(s("path", {
        d: `M${x},${top + h} V${top + r} Q${x},${top} ${x + r},${top} H${x + bw - r} Q${x + bw},${top} ${x + bw},${top + r} V${top + h} Z`,
        fill: "var(--series-1)", opacity: selected && selected !== d.key ? 0.45 : 1 }));
      g.addEventListener("mousemove", e => {
        tip.replaceChildren(el("b", {}, fmt(d.value) + " " + unit), el("span", { class: "muted" }, prettyDate(d.key)));
        tip.style.display = "block";
        tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px";
        tip.style.top = (e.clientY - tip.offsetHeight - 10) + "px";
      });
      g.addEventListener("mouseleave", () => tip.style.display = "none");
      if (onClick) g.addEventListener("click", () => onClick(d.key));
      svg.append(g);
      if (i % every === 0) {
        const t = s("text", { x: cx, y: H - 5, "text-anchor": "middle", fill: "var(--text-muted)", "font-size": 11 });
        t.textContent = d.key.slice(5); svg.append(t);
      }
    });
    svg.append(s("line", { x1: m.l, x2: W - m.r, y1: m.t + ih, y2: m.t + ih, stroke: "var(--text-muted)", "stroke-width": 1 }));
    box.replaceChildren(svg);
  }
  function niceStep(v) { if (v <= 1) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const f of [1, 2, 5, 10]) if (f * p >= v) return f * p; return 10 * p; }

  // ---------- tabs ----------
  let tab = "niche", dailyBuilt = false, idx = {};
  document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));
  function showTab(t) {
    tab = t;
    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
    $("#tab-niche").hidden = t !== "niche"; $("#tab-daily").hidden = t !== "daily";
    if (t === "daily" && !dailyBuilt) { dailyBuilt = true; Daily.build(); }
    if (t === "daily") Daily.redraw(); else NF.redraw();
  }
  window.addEventListener("resize", debounce(() => tab === "daily" ? Daily.redraw() : NF.redraw(), 120));

  // =====================================================================
  // GITHUB SYNC (optional) - saves seeds.json and user/lists.json into the repo
  // =====================================================================
  const GH = (() => {
    const guess = () => {
      const h = location.hostname;
      if (!h.endsWith(".github.io")) return "";
      const owner = h.split(".")[0], seg = location.pathname.split("/").filter(Boolean)[0];
      return owner + "/" + (seg && !seg.endsWith(".html") ? seg : h);
    };
    let token = store.get("gh_token", ""), repo = store.get("gh_repo", "") || guess();
    const shas = {};
    const headers = t => ({ Accept: "application/vnd.github+json", Authorization: "Bearer " + t, "X-GitHub-Api-Version": "2022-11-28" });
    const api = (path, opts = {}) => fetch("https://api.github.com/repos/" + repo + path, { ...opts, headers: { ...headers(token), ...(opts.headers || {}) } });
    const enc = s => { const b = new TextEncoder().encode(s); let bin = ""; for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(bin); };
    const dec = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g, "")), c => c.charCodeAt(0)));
    async function read(path) {
      const r = await api("/contents/" + path + "?t=" + Date.now());
      if (r.status === 404) { shas[path] = null; return null; }
      if (!r.ok) throw new Error("GitHub " + r.status);
      const j = await r.json(); shas[path] = j.sha;
      if (j.content && j.encoding === "base64") return dec(j.content);
      const raw = await api("/contents/" + path + "?t=" + Date.now(), { headers: { Accept: "application/vnd.github.raw+json" } });
      return raw.ok ? raw.text() : null;
    }
    async function write(path, text, message) {
      for (let attempt = 0; attempt < 3; attempt++) {
        if (shas[path] === undefined) await read(path);
        const body = { message, content: enc(text) }; if (shas[path]) body.sha = shas[path];
        const r = await api("/contents/" + path, { method: "PUT", body: JSON.stringify(body) });
        if (r.ok) { shas[path] = (await r.json()).content.sha; return; }
        if (r.status === 409 || r.status === 422) { shas[path] = undefined; continue; }   // file changed meanwhile - refresh sha
        if (r.status === 401) throw new Error("token expired or invalid");
        if (r.status === 403 || r.status === 404) throw new Error("token can't write to " + repo);
        throw new Error("GitHub " + r.status);
      }
      throw new Error("kept conflicting, try again");
    }
    async function test(t, rp) {
      const r = await fetch("https://api.github.com/repos/" + rp, { headers: headers(t) });
      if (r.status === 401) throw new Error("GitHub doesn't accept this token. Copy it again.");
      if (r.status === 404) throw new Error("Repository not found. Check the name, and that the token has access to it.");
      if (!r.ok) throw new Error("GitHub said " + r.status);
      const j = await r.json();
      if (!j.permissions?.push) throw new Error("This token can only read. Give it 'Contents: Read and write'.");
    }
    return {
      on: () => !!(token && repo), get repo() { return repo; }, guess, read, write, test,
      connect(t, rp) { token = t; repo = rp; store.set("gh_token", t); store.set("gh_repo", rp); for (const k in shas) delete shas[k]; },
      disconnect() { token = ""; store.set("gh_token", ""); }
    };
  })();

  // =====================================================================

  const Lists = (() => {
    let data = store.get("nf_lists", { fav: {}, dis: {} }), timer, dirty = false;
    const today = () => new Date().toISOString().slice(0, 10);
    async function load() {
      if (!GH.on()) return;
      try {
        const t = await GH.read("user/lists.json");
        if (t) {
          const remote = JSON.parse(t);
          const merged = { fav: { ...(remote.fav || {}), ...data.fav }, dis: { ...(remote.dis || {}), ...data.dis } };
          const changed = JSON.stringify(merged) !== JSON.stringify({ fav: remote.fav || {}, dis: remote.dis || {} });
          data = pendingRemoval(merged);
          store.set("nf_lists", data);
          if (changed) persist();
        } else if (Object.keys(data.fav).length || Object.keys(data.dis).length) persist();
      } catch (e) { syncPill("err", "⚠ Sync error"); console.warn(e); }
    }
    // removals made while offline are remembered so a merge doesn't bring them back
    function pendingRemoval(d) { const rm = store.get("nf_removed", { fav: [], dis: [] }); rm.fav.forEach(x => delete d.fav[x]); rm.dis.forEach(x => delete d.dis[x]); return d; }
    function noteRemoval(kind, doms) { const rm = store.get("nf_removed", { fav: [], dis: [] }); rm[kind] = [...new Set([...rm[kind], ...doms])].slice(-5000); store.set("nf_removed", rm); }
    function persist() {
      store.set("nf_lists", data);
      if (!GH.on()) return;
      dirty = true; clearTimeout(timer); syncPill("busy", "☁ Saving…");
      timer = setTimeout(async () => {
        try {
          await GH.write("user/lists.json", JSON.stringify(data, null, 0), "Dashboard: update favorites / discarded");
          dirty = false; store.set("nf_removed", { fav: [], dis: [] }); refreshPill();
        } catch (e) { syncPill("err", "⚠ Not saved to GitHub: " + e.message); }
      }, 2500);
    }
    window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
    return {
      load,
      isFav: d => !!data.fav[d], isDis: d => !!data.dis[d],
      favCount: () => Object.keys(data.fav).length, disCount: () => Object.keys(data.dis).length,
      favs: () => Object.entries(data.fav).map(([d, v]) => ({ d, ...v })).sort((a, b) => (b.at || "").localeCompare(a.at || "") || a.d.localeCompare(b.d)),
      diss: () => Object.entries(data.dis).map(([d, at]) => ({ d, at })).sort((a, b) => b.at.localeCompare(a.at) || a.d.localeCompare(b.d)),
      toggleFav(r) {
        if (data.fav[r.d]) { delete data.fav[r.d]; noteRemoval("fav", [r.d]); }
        else data.fav[r.d] = { date: r.date, ids: r.ids, kws: r.kws, loc: r.loc, at: today() };
        persist(); return !!data.fav[r.d];
      },
      discard(rs) { const at = today(); for (const r of rs) { data.dis[r.d] = at; delete data.fav[r.d]; } persist(); },
      restore(doms, favBack = []) { for (const d of doms) delete data.dis[d]; for (const f of favBack) data.fav[f.d] = f.v; noteRemoval("dis", doms); persist(); },
      favEntry: d => data.fav[d]
    };
  })();

  // =====================================================================

  const Seeds = (() => {
    // server = seeds.json in the repo. local = this browser's own list (only used while not connected; null = never edited here)
    let server = [], local = store.get("nf_seeds_local", null);
    if (local === null) {   // migrate the older "your own keywords" feature
      const old = store.get("nf_custom", []);
      if (old.length) { local = old.map(c => ({ id: "seed-" + slug(c.name), name: c.name, keywords: c.keywords, exclude: [] })); store.set("nf_seeds_local", local); }
    }
    function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "seed"; }
    const clean = w => w.toLowerCase().replace(/[^a-z0-9]/g, "");
    function parse(text) {
      const out = [], seen = new Set();
      for (let line of text.split(/\r?\n/)) {
        line = line.trim(); if (!line || line.startsWith("#")) continue;
        let name, words;
        const c = line.indexOf(":");
        if (c > 0) { name = line.slice(0, c).trim(); words = line.slice(c + 1); } else { words = line; }
        const parts = words.split(/[,;]+/).map(s => s.trim()).filter(Boolean);
        const keywords = [...new Set(parts.filter(p => !p.startsWith("-")).map(clean).filter(w => w.length >= 3))];
        const exclude = [...new Set(parts.filter(p => p.startsWith("-")).map(p => clean(p.slice(1))).filter(Boolean))];
        if (!keywords.length) continue;
        name = name || parts.filter(p => !p.startsWith("-"))[0];
        let id = "seed-" + slug(name), n = 2; while (seen.has(id)) id = "seed-" + slug(name) + "-" + n++;
        seen.add(id); out.push({ id, name, keywords, exclude });
      }
      return out;
    }
    const toText = list => list.map(s => {
      const words = [...s.keywords, ...(s.exclude || []).map(e => "-" + e)].join(", ");
      return s.keywords.length === 1 && !(s.exclude || []).length && clean(s.name) === s.keywords[0] ? s.keywords[0] : s.name + ": " + words;
    }).join("\n");
    async function saveServer(list) {
      const body = { "_help": "Your seed keywords, edited from the dashboard. Each seed is its own niche and is searched in every new day automatically.", seeds: list };
      await GH.write("seeds.json", JSON.stringify(body, null, 2) + "\n", "Dashboard: update seed keywords");
      server = list;
    }
    async function load() {
      try {
        if (GH.on()) { const t = await GH.read("seeds.json"); server = t ? (JSON.parse(t).seeds || []) : []; }
        else server = (await getJSON("seeds.json?t=" + Date.now()).catch(() => ({ seeds: [] }))).seeds || [];
      } catch (e) { console.warn("seeds", e); server = []; }
      if (GH.on() && local) {   // first connect: upload what was saved in this browser
        const m = new Map(server.map(x => [x.id, x])); local.forEach(x => m.set(x.id, x));
        try { await saveServer([...m.values()]); local = null; store.set("nf_seeds_local", null); } catch (e) { console.warn(e); }
      }
    }
    return {
      load, parse, toText,
      list: () => GH.on() || !local ? server : local,
      async save(list) { if (GH.on()) await saveServer(list); else { local = list; store.set("nf_seeds_local", list); } }
    };
  })();
  const seedSig = s => [...s.keywords].sort().join(",") + "|" + [...(s.exclude || [])].sort().join(",");

  // ---------- boot ----------

  // =====================================================================
  // NICHE FINDER
  // =====================================================================
  const NF = (() => {
    const S = Object.assign({ range: 7, day: null, ext: "all", loc: "", q: "", sel: [], view: "results", layout: "table" }, store.get("nf_state", {}));
    S.sel = new Set(S.sel); S.page = 0;
    const nicheFiles = new Map();                      // date -> rows
    const scanHits = new Map();                        // date|id|sig -> [{d, kw, loc}]
    const expanded = new Set();
    let rows = [], filtered = [], loadToken = 0, seeds = [], scanIds = new Set(), discardArm = false;
    const missing = new Set();                         // days whose niche file couldn't be loaded
    const SCAN_MAX_DAYS = 60;
    const save = () => store.set("nf_state", { range: S.range, day: S.day, ext: S.ext, loc: S.loc, q: S.q, sel: [...S.sel], view: S.view, layout: S.layout });
    const rangeDates = () => S.day ? [S.day] : (S.range ? days.slice(-S.range) : days).map(d => d.date);
    const rangeLabel = () => S.day ? prettyDate(S.day) : S.range === 1 ? prettyDate(days[days.length - 1].date) : S.range ? "last " + S.range + " days" : "all " + days.length + " days";

    function applySeeds() {
      for (const [id, m] of [...meta]) if (m.group === "My seed keywords") meta.delete(id);

      const sigs = idx.seed_sigs || {};
      scanIds = new Set(seeds.filter(s => sigs[s.id] !== seedSig(s)).map(s => s.id));
    }
    function reloadSeeds() { applySeeds(); load(); }

    function build() {
      if (S.day && !days.some(d => d.date === S.day)) S.day = null;
      applySeeds();
      const host = $("#tab-niche");
      const rangeBtn = (v, t) => el("button", { "data-v": v, onclick: () => { S.range = v; S.day = null; S.page = 0; save(); syncRange(); load(); } }, t);
      host.replaceChildren(
        el("div", { class: "filters" },
          el("div", { class: "seg", id: "nf-range" }, rangeBtn(1, "Latest day"), rangeBtn(7, "7 days"), rangeBtn(30, "30 days"), rangeBtn(0, "All")),
          el("select", { id: "nf-day", "aria-label": "Pick a single day", onchange: e => { S.day = e.target.value || null; S.page = 0; save(); syncRange(); load(); } },
            el("option", { value: "" }, "…or pick a day"), ...days.slice().reverse().map(d => el("option", { value: d.date }, d.date))),
          el("label", {}, "Extension",
            el("select", { id: "nf-ext", onchange: e => { S.ext = e.target.value; S.page = 0; save(); apply(); } },
              el("option", { value: "all" }, "All"), el("option", { value: "com" }, ".com only"), el("option", { value: "main" }, ".com .net .org .co .us"))),
          el("label", {}, "Location", el("select", { id: "nf-loc", onchange: e => { S.loc = e.target.value; S.page = 0; save(); apply(); } })),
          el("div", { style: "flex:1;min-width:200px" },
            el("input", { type: "search", id: "nf-q", placeholder: "Search within results… e.g. emergency, dallas", value: S.q,
              oninput: debounce(e => { S.q = e.target.value.trim().toLowerCase(); S.page = 0; save(); apply(); }, 150) }))),
        el("div", { id: "nf-warn" }),
        el("div", { class: "tiles", id: "nf-tiles" }),
        el("div", { class: "nf-grid" },
          el("section", { class: "card" },
            el("div", { class: "card-head", style: "margin-bottom:6px" },
              el("h2", {}, "Niches"),
              el("button", { class: "btn small", id: "nf-clear", onclick: () => { S.sel.clear(); S.page = 0; save(); apply(); } }, "Show all")),
            el("div", { class: "hint", style: "margin:0 6px 4px" }, "Click to select one or more niches. Counts follow your filters."),
            el("div", { id: "nf-list", class: "scroll", style: "max-height:66vh;margin:0 -6px;padding:0 6px" }),
            el("div", { id: "nf-progress" })),
          el("section", { class: "card" },
            el("div", { class: "vtabs", id: "nf-views" }),
            el("div", { class: "card-head" },
              el("div", {}, el("h2", { id: "nf-title" }, ""), el("div", { class: "sub num", id: "nf-sub" }, "")),
              el("div", { class: "controls", id: "nf-actions" })),
            el("div", { class: "chart", id: "nf-chart", style: "height:140px;margin-bottom:12px" }),

      );

    }
    function syncRange() {
      document.querySelectorAll("#nf-range button").forEach(b => b.setAttribute("aria-pressed", String(!S.day && +b.dataset.v === S.range)));
      const ds = $("#nf-day"); if (ds) ds.value = S.day || "";
    }

    async function load() {
      const token = ++loadToken, dates = rangeDates();
      $("#nf-results").replaceChildren(el("div", { class: "msg" }, "Loading " + rangeLabel() + "…"));
      try {
        await eachLimit(dates.filter(d => !nicheFiles.has(d)), 6, async d => {
          try { nicheFiles.set(d, (await getJSON("data/niches/" + d + ".json")).rows); } catch { nicheFiles.set(d, []); missing.add(d); }
        });

      }
    }

    // seeds that the daily job hasn't processed yet are searched here in the browser
    const matchSeed = (s, label) => { let t = label; for (const ex of s.exclude || []) t = t.split(ex).join("|"); return s.keywords.find(k => t.includes(k)); };
    async function scan(dates, token) {
      const todo = seeds.filter(s => scanIds.has(s.id));

      if (!scanDates.length) return;

        if (token !== loadToken) return;

        for (const s of todo) {
          const key = d + "|" + s.id + "|" + seedSig(s); if (scanHits.has(key)) continue;

      });

    function combine(dates) {
      rows = [];
      for (const date of dates.slice().reverse()) {
        const map = new Map();

    const nicheOk = r => !S.sel.size || (r.ids || []).some(i => S.sel.has(i));
