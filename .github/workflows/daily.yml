name: Daily job

# Runs every 3 hours: downloads new WhoisDS days, sorts them into niches, searches
# seed keywords, checks leads, updates the Gap Finder - all saved privately in Supabase.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:          # "Run workflow" button
  push:
    paths: ["niches.json", "scripts/**"]

permissions:
  contents: write             # only used once, to remove the old public data/ folder

concurrency:
  group: daily-job
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Restore local cache (downloaded zips)
        uses: actions/cache@v4
        with:
          path: .cache
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: One-time migration of old repository data
        run: |
          if [ -d data/zip ]; then mkdir -p .cache/zip && cp -n data/zip/*.zip .cache/zip/ 2>/dev/null || true; fi

      - name: Run the daily job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/run_daily.py --data .cache

      - name: Remove the old public data folder from the repository (one-time)
        if: success()
        run: |
          if [ -d data ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git rm -r -q data
            git commit -m "Move data to private Supabase storage"
            for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
          fi
